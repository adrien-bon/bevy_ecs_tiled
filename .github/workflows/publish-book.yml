name: Publish book

on:
  push:
    branches:
      - main
      - dev

env:
  MDBOOK_VERSION: '0.4.52'
  MDBOOK_TOC_VERSION: '0.15.4'
  MDBOOK_MERMAID_VERSION: 'v0.17.1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}

      - run: |
          # Add mdbook-toc and mdbook-mermaid preprocessors.
          wget -qO- https://github.com/badboy/mdbook-toc/releases/download/${{ env.MDBOOK_TOC_VERSION }}/mdbook-toc-${{ env.MDBOOK_TOC_VERSION }}-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin
          wget -qO- https://github.com/badboy/mdbook-mermaid/releases/download/${{ env.MDBOOK_MERMAID_VERSION }}/mdbook-mermaid-${{ env.MDBOOK_MERMAID_VERSION }}-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin
          # Build book
          CARGO_MANIFEST_DIR=. mdbook build book

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/book